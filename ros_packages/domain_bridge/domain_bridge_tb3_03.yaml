name: domain_bridge_tb3_03
topics:

  # ── UPLINK: 로봇(43) 상태를 관제탑(49) 웹 UI로 전송 ──
  /odom:
    type: nav_msgs/msg/Odometry
    from_domain: 43
    to_domain: 49
    remap: /tb3_03/odom

  # /tf: # 로봇의 실시간 부드러운 움직임 표시 (필수)
  #   type: tf2_msgs/msg/TFMessage
  #   from_domain: 43
  #   to_domain: 49
  #   remap: /tb3_03/tf

  # /tf_static:
  #   type: tf2_msgs/msg/TFMessage
  #   from_domain: 43
  #   to_domain: 49
  #   remap: /tb3_03/tf_static

  /amcl_pose: # 지도 위 로봇의 현재 정확한 좌표 (필수)
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 43
    to_domain: 49
    remap: /tb3_03/amcl_pose

  /plan: # 로봇이 향하고 있는 경로 선 표시 (필수)
    type: nav_msgs/msg/Path
    from_domain: 43
    to_domain: 49
    remap: /tb3_03/plan

  /battery_state: # FMS 배터리 관제용 (필수)
    type: sensor_msgs/msg/BatteryState
    from_domain: 43
    to_domain: 49
    remap: /tb3_03/battery_state

  /imu: # 전복 감지 및 자세 표시용
    type: sensor_msgs/msg/Imu
    from_domain: 43
    to_domain: 49
    remap: /tb3_03/imu

  /victim/confirmed: # 사람 확정 신호 (로봇 43 → 허브 49, 동일 이름) — 프론트 임시 표시
    type: geometry_msgs/msg/PoseStamped
    from_domain: 43
    to_domain: 49
    remap: /victim/confirmed

  # ── DOWNLINK: 관제탑(49)에서 로봇(43)으로 명령 전송 ──
  /tb3_03/cmd_vel: # 비상 정지 및 조이스틱 수동 제어용
    type: geometry_msgs/msg/TwistStamped
    from_domain: 49
    to_domain: 43
    remap: /cmd_vel
    # qos:
    #   reliability: reliable

  /tb3_03/initialpose: # 서버에서 초기 위치 집어주기 (필수)
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 49
    to_domain: 43
    remap: /initialpose

  /tb3_03/goal_pose: # 단순 목적지 전송용
    type: geometry_msgs/msg/PoseStamped
    from_domain: 49
    to_domain: 43
    remap: /goal_pose

  /tb3_03/speak_cmd: # 음성 명령 TTS 전송용
    type: std_msgs/msg/String
    from_domain: 49
    to_domain: 43
    remap: /speak_cmd

  /tb3_03/headlight_cmd: # LED 헤드라이트 제어 (on/off/blink)
    type: std_msgs/msg/String
    from_domain: 49
    to_domain: 43
    remap: /headlight_cmd

  # 서버(49) 맵 서버 → 로봇(43) /map 주입 (navigation-only, latched). 정찰 SLAM은 tb3_01.
  /tb3_03/map:
    type: nav_msgs/msg/OccupancyGrid
    from_domain: 49
    to_domain: 43
    remap: /map
    qos:
      durability: transient_local
      reliability: reliable
      history: keep_last
      depth: 1

services:

  /tb3_03/deploy:                    # 허브(49) 발행 → 로봇(43)에서 /deploy 서비스로 중계
    type: turtlebot_state_msgs/srv/Deploy
    from_domain: 49
    to_domain: 43
    remap: /deploy

  /tb3_03/line_trace:                # 허브(49) 발행 → 로봇(43) /line_trace 서비스로 중계 (라인트레이서 on/off)
    type: turtlebot_state_msgs/srv/LineTrace
    from_domain: 49
    to_domain: 43
    remap: /line_trace

actions:

  # ── DOWNLINK ACTIONS: 관제탑(49)에서 로봇(43) 행동 제어 및 도착 여부 추적 ──
  /tb3_03/navigate_to_pose: # 목적지 할당 및 피드백(도착/실패) 수신용 (필수)
    type: nav2_msgs/action/NavigateToPose
    from_domain: 49  # 💡 40으로 오타나 있던 도메인 ID 수정 완료
    to_domain: 43
    remap: /navigate_to_pose