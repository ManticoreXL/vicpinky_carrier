name: domain_bridge_tb3_04
topics:

  # ── UPLINK: 로봇(44) 상태를 관제탑(49) 웹 UI로 전송 ──
  /odom:
    type: nav_msgs/msg/Odometry
    from_domain: 44
    to_domain: 49
    remap: /tb3_04/odom

  /tf: # 로봇 실시간 자세 (HZ 큼 — 측정용)
    type: tf2_msgs/msg/TFMessage
    from_domain: 44
    to_domain: 49
    remap: /tb3_04/tf

  /tf_static:
    type: tf2_msgs/msg/TFMessage
    from_domain: 44
    to_domain: 49
    remap: /tb3_04/tf_static
    qos:
      durability: transient_local
      reliability: reliable
      history: keep_last
      depth: 1

  /amcl_pose: # 지도 위 로봇의 현재 정확한 좌표 (필수)
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 44
    to_domain: 49
    remap: /tb3_04/amcl_pose

  /plan: # 로봇이 향하고 있는 경로 선 표시 (필수)
    type: nav_msgs/msg/Path
    from_domain: 44
    to_domain: 49
    remap: /tb3_04/plan

  /battery_state: # FMS 배터리 관제용 (필수)
    type: sensor_msgs/msg/BatteryState
    from_domain: 44
    to_domain: 49
    remap: /tb3_04/battery_state

  /imu: # 전복 감지 및 자세 표시용
    type: sensor_msgs/msg/Imu
    from_domain: 44
    to_domain: 49
    remap: /tb3_04/imu

  /recognized_text:
    type: std_msgs/msg/String
    from_domain: 44
    to_domain: 49
    remap: /tb3_04/recognized_text
    qos:
      reliability: reliable  
      durability: volatile
      history: keep_last
      depth: 10

  # ── DOWNLINK: 관제탑(49)에서 로봇(44)으로 명령 전송 ──
  /tb3_04/cmd_vel: # 비상 정지 및 조이스틱 수동 제어용
    type: geometry_msgs/msg/TwistStamped
    from_domain: 49
    to_domain: 44
    remap: /cmd_vel
    # qos:
    #   reliability: reliable

  /tb3_04/initialpose: # 서버에서 초기 위치 집어주기 (필수)
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 49
    to_domain: 44
    remap: /initialpose

  /tb3_04/goal_pose: # 단순 목적지 전송용
    type: geometry_msgs/msg/PoseStamped
    from_domain: 49
    to_domain: 44
    remap: /goal_pose

  /tb3_04/speak_cmd: # 음성 명령 TTS 전송용
    type: std_msgs/msg/String
    from_domain: 49
    to_domain: 44
    remap: /speak_cmd

  /tb3_04/headlight_cmd: # LED 헤드라이트 제어 (on/off/blink)
    type: std_msgs/msg/String
    from_domain: 49
    to_domain: 44
    remap: /headlight_cmd

  # 서버(49) 맵 서버 → 로봇(44) /map 주입 (navigation-only, latched)
  /tb3_04/map:
    type: nav_msgs/msg/OccupancyGrid
    from_domain: 49
    to_domain: 44
    remap: /map
    qos:
      durability: transient_local
      reliability: reliable
      history: keep_last
      depth: 1

services:

  # ── DOWNLINK 서비스: 관제탑(49) → 로봇(44) ──
  /tb3_04/line_trace:                 # 허브(49) 발행 → 로봇(44) /line_trace 서비스로 중계 (라인트레이서 on/off)
    type: turtlebot_state_msgs/srv/LineTrace
    from_domain: 49
    to_domain: 44
    remap: /line_trace

actions:

  # ── DOWNLINK ACTIONS: 관제탑(49)에서 로봇(44) 행동 제어 및 도착 여부 추적 ──
  /tb3_04/navigate_to_pose: # 목적지 할당 및 피드백(도착/실패) 수신용 (필수)
    type: nav2_msgs/action/NavigateToPose
    from_domain: 49  # 💡 40으로 오타나 있던 도메인 ID 수정 완료
    to_domain: 44
    remap: /navigate_to_pose