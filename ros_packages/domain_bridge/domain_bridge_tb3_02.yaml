name: domain_bridge_tb3_02
topics:

  # ── UPLINK: 로봇(42) → 관제탑(49) ──────────────────────────────────────────
  /scan:
    type: sensor_msgs/msg/LaserScan
    from_domain: 42
    to_domain: 49
    remap: /tb3_02/scan

  /odom:
    type: nav_msgs/msg/Odometry
    from_domain: 42
    to_domain: 49
    remap: /tb3_02/odom

  /battery_state:
    type: sensor_msgs/msg/BatteryState
    from_domain: 42
    to_domain: 49
    remap: /tb3_02/battery_state

  /imu:
    type: sensor_msgs/msg/Imu
    from_domain: 42
    to_domain: 49
    remap: /tb3_02/imu

  /amcl_pose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 42
    to_domain: 49
    remap: /tb3_02/amcl_pose

  /plan:
    type: nav_msgs/msg/Path
    from_domain: 42
    to_domain: 49
    remap: /tb3_02/plan

  # ── DOWNLINK: 관제탑(49) → 로봇(42) ────────────────────────────────────────
  /tb3_02/cmd_vel:
    type: geometry_msgs/msg/TwistStamped
    from_domain: 49
    to_domain: 42
    remap: /cmd_vel

  /tb3_02/cmd:
    type: std_msgs/msg/String
    from_domain: 49
    to_domain: 42
    remap: /cmd

  /tb3_02/goal_pose:
    type: geometry_msgs/msg/PoseStamped
    from_domain: 49
    to_domain: 42
    remap: /goal_pose

  /tb3_02/initialpose:
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 49
    to_domain: 42
    remap: /initialpose

services:

  # ── DOWNLINK SERVICES: 관제탑(49)에서 로봇(42)의 서비스 호출하기 ──
  /tb3_02/reset:
    type: std_srvs/srv/Trigger
    from_domain: 49
    to_domain: 42
    remap: /reset

  /tb3_02/reset_odometry:
    type: std_srvs/srv/Trigger
    from_domain: 49
    to_domain: 42
    remap: /reset_odometry

  /tb3_02/motor_power:
    type: std_srvs/srv/SetBool
    from_domain: 49
    to_domain: 42
    remap: /motor_power

  /tb3_02/sound:
    type: turtlebot3_msgs/srv/Sound
    from_domain: 49
    to_domain: 42
    remap: /sound

  /tb3_02/run_diagnosis:
    type: turtlebot3_custom_msgs/srv/SelfDiagnosis
    from_domain: 49
    to_domain: 42
    remap: /run_diagnosis

actions:

  # ── DOWNLINK ACTIONS: 관제탑(40)에서 로봇(42)의 nav2 action 호출 ──
  /tb3_02/navigate_to_pose:
    type: nav2_msgs/action/NavigateToPose
    from_domain: 40
    to_domain: 42
    remap: /navigate_to_pose
