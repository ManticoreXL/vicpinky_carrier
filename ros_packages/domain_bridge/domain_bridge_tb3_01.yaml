name: domain_bridge_tb3_01
topics:

  # ── UPLINK: 로봇(41) 상태를 관제탑(49) 웹 UI로 전송 ──
  /odom:
    type: nav_msgs/msg/Odometry
    from_domain: 41
    to_domain: 49
    remap: /tb3_01/odom

  # /tf: # 로봇의 실시간 부드러운 움직임 표시 (필수)
  #   type: tf2_msgs/msg/TFMessage
  #   from_domain: 41
  #   to_domain: 49
  #   remap: /tb3_01/tf

  # /tf_static:
  #   type: tf2_msgs/msg/TFMessage
  #   from_domain: 41
  #   to_domain: 49
  #   remap: /tb3_01/tf_static

  /amcl_pose: # 지도 위 로봇의 현재 정확한 좌표 (필수)
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 41
    to_domain: 49
    remap: /tb3_01/amcl_pose

  /plan: # 로봇이 향하고 있는 경로 선 표시 (필수)
    type: nav_msgs/msg/Path
    from_domain: 41
    to_domain: 49
    remap: /tb3_01/plan

  /battery_state: # FMS 배터리 관제용 (필수)
    type: sensor_msgs/msg/BatteryState
    from_domain: 41
    to_domain: 49
    remap: /tb3_01/battery_state

  /imu: # 전복 감지 및 자세 표시용
    type: sensor_msgs/msg/Imu
    from_domain: 41
    to_domain: 49
    remap: /tb3_01/imu

  /map: # 정찰 맵 — 로봇(41) /map → 허브(49) /tb3_01/map (latched)
    type: nav_msgs/msg/OccupancyGrid
    from_domain: 41
    to_domain: 49
    remap: /tb3_01/map
    qos:
      durability: transient_local
      reliability: reliable
      history: keep_last
      depth: 1

  /victim/report: # 조난자 좌표 보고 (로봇 41 → 허브 49, 동일 이름)
    type: std_msgs/msg/String
    from_domain: 41
    to_domain: 49
    remap: /victim/report

  # ── DOWNLINK: 관제탑(49)에서 로봇(41)으로 명령 전송 ──
  /tb3_01/cmd_vel: # 비상 정지 및 조이스틱 수동 제어용
    type: geometry_msgs/msg/TwistStamped
    from_domain: 49
    to_domain: 41
    remap: /cmd_vel
    # qos:
    #   reliability: reliable

  /tb3_01/initialpose: # 서버에서 초기 위치 집어주기 (필수)
    type: geometry_msgs/msg/PoseWithCovarianceStamped
    from_domain: 49
    to_domain: 41
    remap: /initialpose

  /tb3_01/goal_pose: # 단순 목적지 전송용
    type: geometry_msgs/msg/PoseStamped
    from_domain: 49
    to_domain: 41
    remap: /goal_pose

  /tb3_01/speak_cmd: # 음성 명령 TTS 전송용
    type: std_msgs/msg/String
    from_domain: 49
    to_domain: 41
    remap: /speak_cmd

  /tb3_01/headlight_cmd: # LED 헤드라이트 제어 (on/off/blink)
    type: std_msgs/msg/String
    from_domain: 49
    to_domain: 41
    remap: /headlight_cmd

services:

  # ── DOWNLINK 서비스: 관제탑(49) → 로봇(41) ──
  /tb3_01/line_trace:                 # 허브(49) 발행 → 로봇(41) /line_trace 서비스로 중계 (라인트레이서 on/off)
    type: turtlebot_state_msgs/srv/LineTrace
    from_domain: 49
    to_domain: 41
    remap: /line_trace

actions:

  # ── DOWNLINK ACTIONS: 관제탑(49)에서 로봇(41) 행동 제어 및 도착 여부 추적 ──
  /tb3_01/navigate_to_pose: # 목적지 할당 및 피드백(도착/실패) 수신용 (필수)
    type: nav2_msgs/action/NavigateToPose
    from_domain: 49
    to_domain: 41
    remap: /navigate_to_pose
